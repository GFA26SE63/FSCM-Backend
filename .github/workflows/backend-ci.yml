name: Backend CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, develop, staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Restore, build, and test
    runs-on: ubuntu-24.04
    services:
      disposal-postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: disposal-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TraceabilityProjectPath: ${{ github.workspace }}/.ci/traceability/FSCM.Traceability.csproj
      FSCM_DISPOSAL_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=postgres;Username=postgres;Password=disposal-ci-only
      FSCM_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=fscm_e2e_ci;Username=postgres;Password=disposal-ci-only

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Check out factory integration test dependency
        uses: actions/checkout@v7
        with:
          repository: GFA26SE63/FSCM-Traceability
          ref: main
          path: .ci/traceability
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore FSCM.slnx

      - name: Build
        run: dotnet build FSCM.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test FSCM.slnx --configuration Release --no-build --logger "trx;LogFilePrefix=test-results" --results-directory artifacts/test-results

      - name: Publish API
        run: dotnet publish src/FSCM.API/FSCM.API.csproj --configuration Release --no-restore --output artifacts/publish

      - name: Upload CI artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-ci-${{ github.run_id }}
          path: artifacts/**
          if-no-files-found: warn
          retention-days: 14
