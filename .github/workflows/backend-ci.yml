name: Backend CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, develop, staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Restore, build, and test
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore FSCM.slnx

      - name: Build
        run: dotnet build FSCM.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test FSCM.slnx --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory artifacts/test-results

      - name: Publish API
        run: dotnet publish src/FSCM.API/FSCM.API.csproj --configuration Release --no-restore --output artifacts/publish

      - name: Upload CI artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-ci-${{ github.run_id }}
          path: artifacts/**
          if-no-files-found: warn
          retention-days: 14
