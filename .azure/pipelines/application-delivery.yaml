name: fscm-backend-$(Date:yyyyMMdd).$(Rev:r)

trigger:
  branches:
    include:
      - main

pr: none

variables:
  - template: variables/backend.yaml

pool:
  vmImage: ubuntu-24.04

stages:
  - stage: Build
    displayName: Restore and build backend
    jobs:
      - job: BuildBackend
        displayName: Restore and compile
        steps:
          - template: templates/backend-build.yaml

  - stage: Test
    displayName: Test backend
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: TestBackend
        displayName: Run automated tests
        steps:
          - template: templates/backend-test.yaml

  - stage: Package
    displayName: Publish and package API artifact
    dependsOn: Test
    condition: succeeded()
    jobs:
      - job: PackageBackend
        displayName: Publish deployable API
        steps:
          - template: templates/backend-package.yaml

  - stage: Deploy
    displayName: Deploy backend to Azure App Service
    dependsOn: Package
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: DeployBackend
        displayName: Deploy API to $(azureWebAppName)
        environment: backend-production
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: $(artifactName)

                - task: AzureCLI@2
                  displayName: Deploy API package (clean)
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      resource_group="`az resource list \
                        --name \"$(azureWebAppName)\" \
                        --resource-type Microsoft.Web/sites \
                        --query '[0].resourceGroup' \
                        --output tsv`"

                      if [ -z "$resource_group" ]; then
                        echo "##vso[task.logissue type=error]Unable to resolve the resource group for $(azureWebAppName)."
                        exit 1
                      fi

                      az webapp deploy \
                        --resource-group "$resource_group" \
                        --name "$(azureWebAppName)" \
                        --src-path "$(Pipeline.Workspace)/$(artifactName)/fscm-backend-api.zip" \
                        --type zip \
                        --clean true \
                        --restart true
