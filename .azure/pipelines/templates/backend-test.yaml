steps:
  - checkout: self

  - checkout: traceability
    path: s/.ci/traceability

  - bash: |
      set -euo pipefail
      docker run --detach --name disposal-postgres -e POSTGRES_PASSWORD=disposal-ci-only -p 127.0.0.1:5432:5432 postgres:17-alpine
      for attempt in {1..30}; do
        if docker exec disposal-postgres pg_isready -U postgres; then exit 0; fi
        sleep 1
      done
      docker logs disposal-postgres
      exit 1
    displayName: Start isolated PostgreSQL for disposal ledger tests

  - task: UseDotNet@2
    displayName: Use .NET SDK $(dotnetSdkVersion)
    inputs:
      packageType: sdk
      version: $(dotnetSdkVersion)

  - task: DotNetCoreCLI@2
    displayName: Test backend
    inputs:
      command: test
      projects: $(backendSolution)
      arguments: --configuration $(buildConfiguration) --collect:"XPlat Code Coverage"
      publishTestResults: true
    env:
      TraceabilityProjectPath: $(traceabilityProjectPath)
      FSCM_DISPOSAL_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=postgres;Username=postgres;Password=disposal-ci-only
