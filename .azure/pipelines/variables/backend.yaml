variables:
  dotnetSdkVersion: '10.0.x'
  buildConfiguration: Release
  # All jobs explicitly check out self here; Build.Repository.LocalPath is
  # ambiguous for Azure multi-repository jobs.
  backendRoot: '$(Pipeline.Workspace)/s/FSCM-Backend'
  backendSolution: '$(backendRoot)/FSCM.slnx'
  traceabilityProjectPath: '$(Build.SourcesDirectory)/.ci/traceability/FSCM.Traceability.csproj'
  apiProject: '$(backendRoot)/src/FSCM.API/FSCM.API.csproj'
  artifactName: fscm-backend-api
  azureServiceConnection: sc-fscm-dev
  azureWebAppType: webApp
  azureWebAppName: app-fmcg-api-dev
