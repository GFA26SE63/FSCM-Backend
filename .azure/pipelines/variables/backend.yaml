variables:
  dotnetSdkVersion: '10.0.x'
  buildConfiguration: Release
  # With multiple checkout steps Azure relocates self to s/FSCM-Backend;
  # this variable follows the self repository in both single- and multi-repo jobs.
  backendSolution: '$(Build.Repository.LocalPath)/FSCM.slnx'
  traceabilityProjectPath: '$(Build.SourcesDirectory)/.ci/traceability/FSCM.Traceability.csproj'
  apiProject: '$(Build.Repository.LocalPath)/src/FSCM.API/FSCM.API.csproj'
  artifactName: fscm-backend-api
  azureServiceConnection: sc-fscm-dev
  azureWebAppType: webApp
  azureWebAppName: app-fmcg-api-dev
