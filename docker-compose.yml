# Local PostgreSQL 16 for development (Azure Database for PostgreSQL in production).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: fscm
      POSTGRES_USER: fscm
      POSTGRES_PASSWORD: fscm
    ports: [ "5432:5432" ]
    volumes: [ "fscm-pg:/var/lib/postgresql/data" ]
volumes:
  fscm-pg: {}
